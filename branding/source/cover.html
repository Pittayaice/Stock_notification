<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1080px; height: 878px; overflow: hidden; background: #0B1220; }
  body {
    position: relative;
    font-family: "Sukhumvit Set", "Thonburi", -apple-system, "Helvetica Neue", sans-serif;
    color: #FFFFFF;
  }
  svg.chart { position: absolute; inset: 0; }
  .content {
    position: absolute; left: 0; right: 0; top: 170px;
    text-align: center;
  }
  .badge {
    display: inline-block; padding: 10px 26px; border-radius: 999px;
    background: rgba(74, 222, 128, 0.14); color: #86EFAC;
    font-size: 30px; font-weight: 600; letter-spacing: 0.5px;
  }
  h1 {
    margin: 26px 0 0; font-size: 132px; line-height: 1; font-weight: 800; letter-spacing: -2px;
    font-family: -apple-system, "Helvetica Neue", sans-serif;
  }
  h1 span { color: #4ADE80; }
  .th { margin-top: 30px; font-size: 44px; font-weight: 600; color: #E5E7EB; }
  .en { margin-top: 8px; font-size: 30px; color: #9CA3AF; }
  .chips { margin-top: 44px; display: flex; justify-content: center; gap: 18px; }
  .chip {
    padding: 14px 22px; border-radius: 18px; background: #1B2535;
    border: 1px solid #2B3647; font-size: 27px; color: #E5E7EB;
  }
  .chip b { color: #4ADE80; font-weight: 700; }
</style></head>
<body>
<svg class="chart" width="1080" height="878" viewBox="0 0 1080 878" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E293B"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#4ADE80" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#4ADE80" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4ADE80" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#4ADE80" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="878" fill="url(#bg)"/>
  <rect width="1080" height="878" fill="url(#glow)"/>
  <g stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="2">
    <line x1="0" y1="160" x2="1080" y2="160"/><line x1="0" y1="320" x2="1080" y2="320"/>
    <line x1="0" y1="480" x2="1080" y2="480"/><line x1="0" y1="640" x2="1080" y2="640"/>
  </g>
  <!-- background candles -->
  <g opacity="0.16">
    <rect x="60" y="770" width="26" height="60" rx="4" fill="#4ADE80"/>
    <rect x="130" y="760" width="26" height="50" rx="4" fill="#F87171"/>
    <rect x="200" y="765" width="26" height="65" rx="4" fill="#4ADE80"/>
    <rect x="270" y="745" width="26" height="60" rx="4" fill="#4ADE80"/>
    <rect x="340" y="750" width="26" height="45" rx="4" fill="#F87171"/>
    <rect x="740" y="740" width="26" height="60" rx="4" fill="#4ADE80"/>
    <rect x="810" y="735" width="26" height="45" rx="4" fill="#F87171"/>
    <rect x="880" y="715" width="26" height="70" rx="4" fill="#4ADE80"/>
    <rect x="950" y="705" width="26" height="65" rx="4" fill="#4ADE80"/>
    <rect x="1020" y="690" width="26" height="70" rx="4" fill="#4ADE80"/>
  </g>
  <!-- rising line along the bottom -->
  <path d="M0,840 C120,830 180,815 260,822 S400,800 470,808 S600,780 680,786 S820,745 900,740 S1010,705 1080,690 L1080,878 L0,878 Z" fill="url(#area)"/>
  <path d="M0,840 C120,830 180,815 260,822 S400,800 470,808 S600,780 680,786 S820,745 900,740 S1010,705 1080,690" fill="none" stroke="#4ADE80" stroke-width="6" stroke-linecap="round"/>
</svg>

<div class="content">
  <div class="badge">🇹🇭 SET &nbsp;·&nbsp; 🇺🇸 US</div>
  <h1>My <span>Stock</span></h1>
  <div class="th">สรุปพอร์ตหุ้นไทยและอเมริกา ใน LINE</div>
  <div class="en">Your Thai &amp; US portfolio, right in your chat</div>
  <div class="chips">
    <div class="chip">📊 กำไร/ขาดทุน <b>±%</b> <b>±฿</b></div>
    <div class="chip">📈 เส้น <b>MA</b> 20/50/200</div>
    <div class="chip">💰 รวมเป็น<b>เงินบาท</b></div>
  </div>
</div>
</body></html>
