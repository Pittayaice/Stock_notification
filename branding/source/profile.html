<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html, body { margin: 0; width: 640px; height: 640px; overflow: hidden; background: #0B1220; }
  svg { display: block; }
</style></head>
<body>
<!-- LINE shows the profile picture as a circle: keep everything inside the middle -->
<svg width="640" height="640" viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E293B"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.52" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#4ADE80" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#4ADE80" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arrow" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#22C55E"/>
      <stop offset="1" stop-color="#86EFAC"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="640" height="640" fill="url(#bg)"/>
  <circle cx="330" cy="320" r="290" fill="url(#glow)"/>

  <g transform="translate(328 338) scale(1.12) translate(-328 -338)">
  <!-- grid -->
  <g stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="3">
    <line x1="130" y1="230" x2="530" y2="230"/>
    <line x1="130" y1="330" x2="530" y2="330"/>
    <line x1="130" y1="430" x2="530" y2="430"/>
  </g>

  <!-- candlesticks, rising left to right -->
  <g stroke-linecap="round" opacity="0.55">
    <line x1="190" y1="385" x2="190" y2="485" stroke="#4ADE80" stroke-width="6"/>
    <rect x="171" y="405" width="38" height="58" rx="6" fill="#4ADE80"/>
    <line x1="260" y1="345" x2="260" y2="445" stroke="#F87171" stroke-width="6"/>
    <rect x="241" y="362" width="38" height="56" rx="6" fill="#F87171"/>
    <line x1="330" y1="330" x2="330" y2="440" stroke="#4ADE80" stroke-width="6"/>
    <rect x="311" y="350" width="38" height="70" rx="6" fill="#4ADE80"/>
    <line x1="400" y1="255" x2="400" y2="370" stroke="#4ADE80" stroke-width="6"/>
    <rect x="381" y="275" width="38" height="76" rx="6" fill="#4ADE80"/>
    <line x1="470" y1="190" x2="470" y2="310" stroke="#4ADE80" stroke-width="6"/>
    <rect x="451" y="208" width="38" height="80" rx="6" fill="#4ADE80"/>
  </g>

  <!-- trend arrow: glow, then the line -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="140,440 260,320 340,400 470,270" stroke="#4ADE80" stroke-width="40" opacity="0.45" filter="url(#soft)"/>
    <polyline points="140,440 260,320 340,400 470,270" stroke="url(#arrow)" stroke-width="30"/>
  </g>
  <polygon points="526,214 501.8,301.8 438.2,238.2" fill="#86EFAC" stroke="#86EFAC" stroke-width="10" stroke-linejoin="round"/>
  </g>
</svg>
</body></html>
